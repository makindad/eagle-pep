<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Eagle Peps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
        background:#05070a;
        color:#ffffff;
        font-family:"Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing:antialiased;
        overflow-x:hidden;
    }

    @keyframes cxHolo{ 0%{background-position:0% 50%} 100%{background-position:300% 50%} }

    .stage{
        position:relative;
        min-height:100vh;
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:34px 24px 40px;
    }

    .topline{
        position:absolute; top:0; left:0; right:0; height:2px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
        box-shadow:0 0 14px rgba(255,255,255,.5);
    }

    .inner{ width:100%; max-width:540px; }

    /* logo on a black plate, holographic glow behind */
    .logo{
        position:relative;
        display:inline-flex; align-items:center; justify-content:center;
        margin:0 auto 24px;
        padding:12px 20px;
        border-radius:16px;
        background:#000000;
        border:1px solid rgba(255,255,255,.4);
    }
    .logo::before{
        content:"";
        position:absolute; inset:-15px;
        z-index:-1;
        border-radius:24px;
        background:linear-gradient(115deg, #f4f4f6, #c7d2da, #bfeaf0, #e6c6ef, #f7f7f9, #c7d2da, #f4f4f6);
        background-size:300% 300%;
        filter:blur(18px);
        opacity:.8;
        pointer-events:none;
        animation:cxHolo 6s linear infinite;
    }
    .logo img{ display:block; width:186px; max-width:60vw; height:auto; }

    /* heading - each sentence its own line, roomy, no glow */
    .heading{
        font-size:clamp(30px, 8.4vw, 52px);
        font-weight:900;
        line-height:1.16;
        letter-spacing:-.5px;
        margin-bottom:16px;
    }
    .heading .line{ display:block; color:#ffffff; }
    .heading .cy{ display:block; margin-top:2px; color:#1faf78; }

    /* sub-heading */
    .sub{
        font-size:clamp(15px, 4.3vw, 18px);
        font-weight:600;
        line-height:1.5;
        color:#c5ced7;
        max-width:440px;
        margin:0 auto 24px;
    }

    /* shipping offer - cyan glow behind the text (no box) */
    .offer{
        position:relative;
        margin:0 auto 28px;
        padding:10px 8px;
        text-align:center;
    }
    .offer::before{
        content:"";
        position:absolute;
        left:50%; top:50%;
        transform:translate(-50%,-50%);
        width:104%;
        height:165%;
        border-radius:60px;
        background:radial-gradient(ellipse at center, #164d38, rgba(10,162,255,.24) 45%, transparent 72%);
        filter:blur(24px);
        z-index:0;
        pointer-events:none;
    }
    .offer p, .offer span{ position:relative; z-index:1; }
    .offer p{
        font-size:clamp(16px, 4.6vw, 19px);
        font-weight:900;
        line-height:1.34;
        color:#ffffff;
        text-shadow:0 1px 8px rgba(0,0,0,.8);
    }
    .offer span{
        display:block;
        margin-top:6px;
        font-size:11px;
        font-weight:900;
        letter-spacing:3px;
        text-transform:uppercase;
        color:#ffffff;
        text-shadow:0 1px 6px rgba(0,0,0,.8);
    }

    /* small label above contact */
    .qlabel{
        font-size:13px;
        font-weight:600;
        color:#9aa3ad;
        margin-bottom:9px;
    }

    /* buttons */
    .btn{
        display:flex; align-items:center; justify-content:center; gap:11px;
        width:100%;
        text-decoration:none;
        font-weight:900;
        letter-spacing:.6px;
        text-transform:uppercase;
        border-radius:15px;
        transition:transform .16s ease, box-shadow .25s ease, background .2s ease, color .2s ease;
    }

    /* contact - outline */
    .btn-contact{
        padding:15px 18px;
        margin-bottom:14px;
        font-size:14px;
        color:#ffffff;
        border:1px solid rgba(255,255,255,.4);
        background:rgba(255,255,255,.03);
    }
    .btn-contact:hover{
        transform:translateY(-2px);
        border-color:#ffffff;
        background:rgba(255,255,255,.09);
    }

    /* main - white, black text, white outline, blue glow behind */
    .btn-main{
        padding:20px 18px;
        font-size:clamp(16px, 4.8vw, 20px);
        color:#000000;
        border:2px solid #ffffff;
        background:#ffffff;
        box-shadow:0 0 30px #164d38, 0 0 62px rgba(0,180,255,.32);
    }
    .btn-main:hover{
        transform:translateY(-2px);
        box-shadow:0 0 44px #164d38, 0 0 84px rgba(0,180,255,.45);
    }
    .btn-main i{ transition:transform .2s ease; }
    .btn-main:hover i{ transform:translateX(5px); }

    @media (prefers-reduced-motion: reduce){
        .logo::before{ animation:none; }
    }
    </style>
    </head>
    <body>

    <section class="stage">
        <div class="topline"></div>
        <div class="inner">

            <div class="logo">
                <img src="https://eaglepeps.com/wp-content/uploads/2026/06/Cropped-Logo1.png" alt="Eagle Peps">
            </div>

            <h1 class="heading">
                <span class="line">Lab grade research chemicals.</span>
                <span class="cy">Pure and simple.</span>
            </h1>

            <p class="sub">We keep things clear and deliver quickly.</p>

        

            <a class="btn btn-main" href="https://eaglepeps.com/">
                Browse Research Catalog <i class="fas fa-arrow-right"></i>
            </a>

        </div>
    </section>

    </body>
</html>
